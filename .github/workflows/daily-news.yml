name: 每日新闻监测

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ---------- 新增的调试步骤（缩进必须和上面完全对齐） ----------
      - name: 🔍 深度调试目录结构
        run: |
          echo "=== 当前工作目录 ==="
          pwd
          echo "=== 根目录文件列表 ==="
          ls -la
          echo "=== src 文件夹内容 ==="
          ls -la src/ || echo "src 文件夹不存在！"
          echo "=== 检查 __init__.py 是否存在 ==="
          cat src/__init__.py 2>/dev/null || echo "src/__init__.py 不存在！"
          echo "=== 检查是否有 src.py 捣乱 ==="
          ls -la src.py 2>/dev/null && echo "⚠️ 发现根目录有 src.py 文件！" || echo "安全，没有 src.py"
      # ---------- 调试步骤结束 ----------

      - name: 创建 .env 文件（从 Secrets 注入）
        run: |
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env
          echo "DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL || 'deepseek-chat' }}" >> .env
          echo "DEEPSEEK_BASE_URL=${{ secrets.DEEPSEEK_BASE_URL || 'https://api.deepseek.com' }}" >> .env
          echo "SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.qq.com' }}" >> .env
          echo "SMTP_PORT=${{ secrets.SMTP_PORT || '465' }}" >> .env
          echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
          echo "SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}" >> .env
          echo "MAIL_TO=${{ secrets.MAIL_TO }}" >> .env
          echo "MAIL_FROM=${{ secrets.MAIL_FROM }}" >> .env
          echo "MIN_SCORE_TO_EMAIL=${{ secrets.MIN_SCORE_TO_EMAIL || '75' }}" >> .env
          echo "MAX_EMAIL_EVENTS=${{ secrets.MAX_EMAIL_EVENTS || '10' }}" >> .env
          echo "DB_PATH=market_events.db" >> .env

      - name: 运行主程序
        run: python -m src.main
